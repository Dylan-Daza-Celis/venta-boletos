<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sonora | Iniciar sesión</title>
  <style>
    :root{--bg:#0d0d15;--panel:#191826;--line:#383451;--pink:#ff4f9a;--yellow:#ffd166;--text:#fff9f1;--muted:#aaa6bd}
    *{box-sizing:border-box}[hidden]{display:none !important}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 80% 0,#49234c 0,var(--bg) 50%);color:var(--text);font:16px system-ui,sans-serif}
    .card{width:min(100%,460px);padding:32px;background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:0 18px 50px #0006}
    .eyebrow{color:var(--yellow);font-size:13px;font-weight:800;letter-spacing:3px}.card h1{margin:14px 0 8px;color:var(--pink)}.muted{color:var(--muted)}form{display:grid;gap:14px;margin-top:24px}label{display:grid;gap:6px;color:var(--muted);font-size:14px}input,select{padding:11px 13px;border:1px solid var(--line);border-radius:9px;background:#10101a;color:var(--text);font:inherit}select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--yellow) 50%),linear-gradient(135deg,var(--yellow) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 12px) 50%;background-size:6px 6px,6px 6px;background-repeat:no-repeat}button{padding:11px 13px;border:0;border-radius:9px;background:var(--yellow);color:#17131b;font:inherit;font-weight:800;cursor:pointer}button.secondary{background:transparent;border:1px solid var(--line);color:var(--text)}.links{margin-top:18px;text-align:center}.links button{padding:0;background:none;color:var(--yellow);font-weight:400}.message{min-height:24px;color:var(--yellow)}
  </style>
</head>
<body>
  <main class="card">
    <div class="eyebrow">SONORA · ACCESO</div>
    <h1>Bienvenido</h1>
    <p class="muted">Inicia sesión para comprar boletos o administrar conciertos.</p>
    <form id="login-form">
      <label>Usuario<input name="username" autocomplete="username" required></label>
      <label>Contraseña<input name="password" type="password" autocomplete="current-password" required></label>
      <button>Iniciar sesión</button>
    </form>
    <div class="links">¿Aún no tienes cuenta? <button type="button" id="show-register">Crear una cuenta</button></div>
    <form id="register-credentials" hidden>
      <h2>Crear cuenta</h2>
      <label>Usuario<input name="username" autocomplete="username" minlength="3" required></label>
      <label>Contraseña<input name="password" type="password" autocomplete="new-password" minlength="4" required></label>
      <button type="submit">Continuar</button>
      <button type="button" class="secondary" id="hide-register">Volver al login</button>
    </form>
    <form id="register-details" hidden>
      <h2>Datos personales</h2>
      <label>Nombre<input name="nombre" required></label>
      <label>Apellido paterno<input name="apellidoPaterno" required></label>
      <label>Apellido materno<input name="apellidoMaterno" required></label>
      <label>Día de nacimiento<input name="diaNacimiento" type="number" min="1" max="31" required></label>
      <label>Mes de nacimiento<input name="mesNacimiento" type="number" min="1" max="12" required></label>
      <label>Año de nacimiento<input name="anioNacimiento" type="number" min="1900" required></label>
      <label>Género<select name="genero" required><option value="">Selecciona una opción</option><option>Hombre</option><option>Mujer</option><option>Personalizado</option><option>Prefiero no decirlo</option></select></label>
      <label>Correo electrónico<input name="correo" type="email" required></label>
      <label>Número de celular<input name="telefono" type="tel" required></label>
      <button type="submit">Crear cuenta</button>
      <button type="button" class="secondary" id="back-credentials">Volver</button>
    </form>
    <p class="message" id="message"></p>
  </main>
  <script>
    const $=id=>document.getElementById(id);
    async function api(url,options){const response=await fetch(url,options);const data=response.status===204?null:await response.json();if(!response.ok)throw new Error(data.error);return data}
    let credentials={};
    function showRegister(){ $("login-form").hidden=true; $("register-credentials").hidden=false; $("register-details").hidden=true; $("show-register").parentElement.hidden=true; }
    function showLogin(){ $("register-credentials").hidden=true; $("register-details").hidden=true; $("login-form").hidden=false; $("show-register").parentElement.hidden=false; credentials={}; }
    $("show-register").addEventListener("click",showRegister);
    $("hide-register").addEventListener("click",showLogin);
    $("login-form").addEventListener("submit",async event=>{event.preventDefault();try{await api("/api/auth/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(Object.fromEntries(new FormData(event.target)))});const returnTo=new URLSearchParams(window.location.search).get("returnTo");window.location.href=returnTo&&returnTo.startsWith("/")?returnTo:"/"}catch(error){$("message").textContent=error.message}});
    $("register-credentials").addEventListener("submit",event=>{event.preventDefault();credentials=Object.fromEntries(new FormData(event.target));$("register-credentials").hidden=true;$("register-details").hidden=false});
    $("back-credentials").addEventListener("click",()=>{$("register-details").hidden=true;$("register-credentials").hidden=false});
    $("register-details").addEventListener("submit",async event=>{event.preventDefault();try{const details=Object.fromEntries(new FormData(event.target));await api("/api/auth/register",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({...credentials,...details})});event.target.reset();$("register-credentials").reset();showLogin();$("message").textContent="Registro exitoso. Ahora inicia sesión."}catch(error){$("message").textContent=error.message}});
  </script>
</body>
</html>

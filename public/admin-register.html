<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sonora | Registrar administrador</title>
  <style>
    :root{--bg:#0d0d15;--panel:#191826;--line:#383451;--pink:#ff4f9a;--yellow:#ffd166;--text:#fff9f1;--muted:#aaa6bd}
    *{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 80% 0,#49234c 0,var(--bg) 50%);color:var(--text);font:16px system-ui,sans-serif}.card{width:min(100%,500px);padding:32px;background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:0 18px 50px #0006}.eyebrow{color:var(--yellow);font-size:13px;font-weight:800;letter-spacing:3px}h1{color:var(--pink);margin:14px 0 8px}form{display:grid;gap:14px;margin-top:24px}label{display:grid;gap:6px;color:var(--muted);font-size:14px}input,select{padding:11px 13px;border:1px solid var(--line);border-radius:9px;background:#10101a;color:var(--text);font:inherit}button{padding:11px 13px;border:0;border-radius:9px;background:var(--yellow);color:#17131b;font:inherit;font-weight:800;cursor:pointer}button.secondary{background:transparent;border:1px solid var(--line);color:var(--text)}.message{min-height:24px;color:var(--yellow)}
  </style>
</head>
<body>
  <main class="card">
    <div class="eyebrow">SONORA · ADMINISTRACIÓN</div><h1>Registrar administrador</h1>
    <p>Completa ambos formularios. Los datos se guardan solamente cuando finalices el registro.</p>
    <form id="credentials-form">
      <label>Usuario<input name="username" minlength="3" required></label><label>Contraseña<input name="password" type="password" minlength="4" required></label>
      <button>Continuar</button>
    </form>
    <form id="details-form" hidden>
      <label>Nombre<input name="nombre" required></label><label>Apellido paterno<input name="apellidoPaterno" required></label><label>Apellido materno<input name="apellidoMaterno" required></label>
      <label>Día de nacimiento<input name="diaNacimiento" type="number" min="1" max="31" required></label><label>Mes de nacimiento<input name="mesNacimiento" type="number" min="1" max="12" required></label><label>Año de nacimiento<input name="anioNacimiento" type="number" min="1900" required></label>
      <label>Género<select name="genero" required><option value="">Selecciona una opción</option><option>Hombre</option><option>Mujer</option><option>Personalizado</option><option>Prefiero no decirlo</option></select></label><label>Correo electrónico<input name="correo" type="email" required></label><label>Número de celular<input name="telefono" type="tel" required></label>
      <button>Crear administrador</button><button type="button" class="secondary" id="back">Volver</button>
    </form>
    <p class="message" id="message"></p><a href="/">Volver a la aplicación</a>
  </main>
  <script>
    const $=id=>document.getElementById(id);let credentials={};
    async function api(url,options){const response=await fetch(url,options);const data=await response.json();if(!response.ok)throw new Error(data.error);return data}
    $("credentials-form").addEventListener("submit",event=>{event.preventDefault();credentials=Object.fromEntries(new FormData(event.target));$("credentials-form").hidden=true;$("details-form").hidden=false});
    $("back").addEventListener("click",()=>{$("details-form").hidden=true;$("credentials-form").hidden=false});
    $("details-form").addEventListener("submit",async event=>{event.preventDefault();try{const details=Object.fromEntries(new FormData(event.target));await api("/api/auth/admins",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({...credentials,...details})});window.location.href="/"}catch(error){$("message").textContent=error.message}});
  </script>
</body>
</html>
